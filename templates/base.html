<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}VietKid - Học tiếng Việt vui vẻ{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👑</text></svg>">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="/" class="brand"><span class="mascot">👸</span> VietKid <span style="font-size:1.1rem;">👑</span></a>
      <nav class="main-nav">
        <a href="/" class="{{ 'active' if request.path == '/' else '' }}">Trang chủ</a>
        <a href="/alphabet" class="{{ 'active' if request.path == '/alphabet' else '' }}">Bảng chữ cái</a>
        <a href="/writing" class="{{ 'active' if request.path.startswith('/writing') else '' }}">✍️ Tập viết</a>
        <a href="/topics" class="{{ 'active' if request.path.startswith('/topics') else '' }}">Từ vựng</a>
        <a href="/progress" class="{{ 'active' if request.path == '/progress' else '' }}">Thành tích</a>
      </nav>
      <div id="header-profile-slot"></div>
    </div>
  </header>

  <main>
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>

  <footer class="site-footer">
    Học tiếng Việt mỗi ngày cùng VietKid 🇻🇳💕🇯🇵
  </footer>

  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
  <script src="{{ url_for('static', filename='js/speech.js') }}"></script>
  <script src="{{ url_for('static', filename='js/sound.js') }}"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
