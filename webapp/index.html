<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VietKid</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👑</text></svg>">
<style>
/* ==========================================================================
   VietKid - giao diện học tiếng Việt phong cách công chúa cho bé gái
   (Bản web app tĩnh - chạy hoàn toàn trong trình duyệt, không cần server)
   ========================================================================== */

@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@500;600;700&display=swap');

:root {
  --pink: #ff5d9e;
  --pink-deep: #e0338f;
  --pink-soft: #ffd6ea;
  --gold: #ffc857;
  --gold-deep: #f2a91c;
  --lavender: #b47bf0;
  --lilac: #d9b8ff;
  --red: #ff5c5c;
  --yellow: #ffc93c;
  --green: #4ecb71;
  --blue: #4fb0ff;
  --purple: #b47bf0;
  --orange: #ff9f43;
  --bg: #fff5fa;
  --card-bg: #ffffff;
  --text: #4a2e45;
  --text-soft: #8a6d84;
  --shadow: 0 6px 0 rgba(224, 51, 143, 0.12);
  --radius-lg: 28px;
  --radius-md: 20px;
  --radius-sm: 14px;
  font-size: 18px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  max-width: 100%;
  overflow-x: hidden;
}

body {
  font-family: 'Quicksand', 'Baloo 2', sans-serif;
  background:
    radial-gradient(circle at 8% 12%, rgba(255, 214, 234, 0.9) 0%, transparent 38%),
    radial-gradient(circle at 92% 18%, rgba(217, 184, 255, 0.7) 0%, transparent 42%),
    radial-gradient(circle at 50% 100%, rgba(255, 200, 87, 0.25) 0%, transparent 55%),
    radial-gradient(1.5px 1.5px at 15% 25%, #ffb6d9 100%, transparent),
    radial-gradient(1.5px 1.5px at 80% 15%, #f6c9ff 100%, transparent),
    radial-gradient(1.5px 1.5px at 60% 45%, #ffe08a 100%, transparent),
    radial-gradient(1.5px 1.5px at 30% 70%, #ffb6d9 100%, transparent),
    radial-gradient(1.5px 1.5px at 90% 80%, #d9b8ff 100%, transparent),
    var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

h1, h2, h3, .heading {
  font-family: 'Baloo 2', sans-serif;
  font-weight: 800;
  margin: 0 0 0.4em;
}

a { color: inherit; text-decoration: none; }

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  touch-action: manipulation;
}

img, svg { max-width: 100%; }

.container {
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 20px;
}

/* ---------------------------------------------------------------------- */
/* Header / nav                                                          */
/* ---------------------------------------------------------------------- */
.site-header {
  background: linear-gradient(135deg, var(--pink), var(--lavender));
  padding: 14px 0;
  box-shadow: 0 4px 14px rgba(224, 51, 143, 0.25);
  position: relative;
  overflow: hidden;
}

.site-header::after {
  content: "✨";
  position: absolute;
  top: 6px;
  right: 8%;
  font-size: 1.2rem;
  opacity: 0.8;
  animation: twinkle 2.6s ease-in-out infinite;
}

.site-header .container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  position: relative;
  z-index: 1;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: 'Baloo 2', sans-serif;
  font-weight: 800;
  font-size: 1.6rem;
  color: #fff;
}

.brand .mascot {
  font-size: 2rem;
  animation: bounce 2.4s ease-in-out infinite;
}

.main-nav {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.main-nav a {
  color: #fff;
  background: rgba(255, 255, 255, 0.2);
  padding: 8px 16px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 0.95rem;
  transition: transform 0.15s ease, background 0.15s ease;
  min-height: 38px;
  display: inline-flex;
  align-items: center;
}

.main-nav a:hover, .main-nav a.active {
  background: #fff;
  color: var(--pink-deep);
  transform: translateY(-2px);
}

.header-profile {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(255, 255, 255, 0.24);
  padding: 6px 14px 6px 6px;
  border-radius: 999px;
  color: #fff;
  font-weight: 700;
}

.header-profile .avatar-badge {
  font-size: 1.4rem;
  background: #fff;
  border-radius: 50%;
  width: 34px;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

/* ---------------------------------------------------------------------- */
/* Layout general                                                         */
/* ---------------------------------------------------------------------- */
main {
  flex: 1;
  padding: 30px 0 60px;
}

.page-title {
  text-align: center;
  font-size: 2rem;
  margin-bottom: 6px;
}

.page-subtitle {
  text-align: center;
  color: var(--text-soft);
  margin-bottom: 28px;
  font-weight: 600;
  padding: 0 10px;
}

.site-footer {
  text-align: center;
  padding: 18px;
  color: var(--text-soft);
  font-size: 0.85rem;
}

/* ---------------------------------------------------------------------- */
/* Buttons                                                                 */
/* ---------------------------------------------------------------------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 26px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 1rem;
  background: var(--gold);
  color: var(--text);
  box-shadow: var(--shadow);
  transition: transform 0.12s ease, box-shadow 0.12s ease;
  min-height: 44px;
}

.btn:active { transform: translateY(4px); box-shadow: none; }
.btn:hover { transform: translateY(-2px); }

.btn-primary { background: linear-gradient(135deg, var(--pink), var(--lavender)); color: #fff; }
.btn-green { background: var(--green); color: #fff; }
.btn-blue { background: var(--blue); color: #fff; }
.btn-outline { background: #fff; border: 3px solid var(--lavender); color: var(--lavender); }
.btn-lg { padding: 16px 34px; font-size: 1.15rem; }
.btn-block { width: 100%; justify-content: center; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }

/* ---------------------------------------------------------------------- */
/* Profile select screen                                                  */
/* ---------------------------------------------------------------------- */
.profile-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 18px;
  margin: 24px 0;
}

.profile-card {
  background: var(--card-bg);
  border-radius: var(--radius-md);
  padding: 18px 10px;
  text-align: center;
  box-shadow: var(--shadow);
  border: 4px solid transparent;
  transition: transform 0.15s ease, border-color 0.15s ease;
}

.profile-card:hover { transform: translateY(-4px); border-color: var(--gold); }
.profile-card .avatar { font-size: 3rem; }
.profile-card .name { font-weight: 700; margin-top: 6px; }
.profile-card .stars { color: var(--gold-deep); font-weight: 700; font-size: 0.9rem; }

.new-profile-card {
  border: 3px dashed var(--lavender);
  background: transparent;
  border-radius: var(--radius-md);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 18px 10px;
  color: var(--lavender);
  font-weight: 700;
  gap: 6px;
}

.avatar-picker {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 12px 0;
}

.avatar-picker button {
  font-size: 1.6rem;
  background: #fff;
  border-radius: 50%;
  width: 52px;
  height: 52px;
  box-shadow: var(--shadow);
}

.avatar-picker button.selected {
  background: var(--pink-soft);
  outline: 3px solid var(--pink);
  transform: scale(1.1);
}

.text-input {
  width: 100%;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  border: 3px solid #f7dcee;
  font-size: 1.1rem;
  font-family: inherit;
}
.text-input:focus { outline: none; border-color: var(--pink); }

.card-panel {
  background: var(--card-bg);
  border-radius: var(--radius-lg);
  padding: 26px;
  box-shadow: var(--shadow);
  max-width: 480px;
  margin: 0 auto;
}

/* ---------------------------------------------------------------------- */
/* Home dashboard                                                         */
/* ---------------------------------------------------------------------- */
.welcome-banner {
  background: linear-gradient(135deg, var(--pink), var(--gold));
  border-radius: var(--radius-lg);
  padding: 26px 30px;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
  box-shadow: var(--shadow);
  margin-bottom: 30px;
  position: relative;
  overflow: hidden;
}

.welcome-banner::before {
  content: "👑";
  position: absolute;
  top: -10px;
  right: 16px;
  font-size: 3.4rem;
  opacity: 0.25;
  transform: rotate(12deg);
}

.welcome-banner .who { display: flex; align-items: center; gap: 14px; z-index: 1; }
.welcome-banner .who .avatar { font-size: 3.2rem; }
.welcome-banner h2 { margin: 0; font-size: 1.6rem; }
.welcome-banner .stars-total { font-size: 1.3rem; font-weight: 800; z-index: 1; }

.quick-links {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  margin-bottom: 30px;
}

.quick-link-card {
  background: var(--card-bg);
  border-radius: var(--radius-md);
  padding: 24px;
  text-align: center;
  box-shadow: var(--shadow);
  transition: transform 0.15s ease;
  border-top: 8px solid var(--pink);
}

.quick-link-card:nth-child(2) { border-top-color: var(--lavender); }
.quick-link-card:nth-child(3) { border-top-color: var(--gold); }
.quick-link-card:nth-child(4) { border-top-color: var(--pink-deep); }

.quick-link-card:hover { transform: translateY(-6px); }
.quick-link-card .icon { font-size: 3rem; display: block; margin-bottom: 10px; }
.quick-link-card .title { font-weight: 800; font-size: 1.15rem; }
.quick-link-card .desc { color: var(--text-soft); font-size: 0.9rem; margin-top: 4px; }

.badge-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 14px 0 0;
}

.badge-chip {
  background: #fff;
  color: var(--text);
  border-radius: 999px;
  padding: 8px 14px;
  box-shadow: var(--shadow);
  font-weight: 700;
  font-size: 0.9rem;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ---------------------------------------------------------------------- */
/* Alphabet grid                                                          */
/* ---------------------------------------------------------------------- */
.alphabet-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  gap: 16px;
}

.letter-card {
  perspective: 800px;
  height: 130px;
}

.letter-card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform 0.5s;
  transform-style: preserve-3d;
  cursor: pointer;
}

.letter-card.flipped .letter-card-inner { transform: rotateY(180deg); }

.letter-face {
  position: absolute;
  inset: 0;
  border-radius: var(--radius-md);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  backface-visibility: hidden;
  box-shadow: var(--shadow);
}

.letter-front {
  background: linear-gradient(135deg, var(--pink), var(--lavender));
  color: #fff;
  font-size: 2.4rem;
  font-weight: 800;
  font-family: 'Baloo 2', sans-serif;
}

.letter-back {
  background: #fff;
  transform: rotateY(180deg);
  padding: 6px;
  text-align: center;
}

.letter-back .emoji { font-size: 2rem; }
.letter-back .word { font-weight: 700; font-size: 1rem; }
.letter-back .ja { color: var(--text-soft); font-size: 0.75rem; }

/* ---------------------------------------------------------------------- */
/* Tập viết chữ (writing practice)                                       */
/* ---------------------------------------------------------------------- */
.writing-select-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
  gap: 14px;
}

.writing-select-card {
  background: linear-gradient(135deg, var(--pink), var(--lavender));
  border-radius: var(--radius-md);
  box-shadow: var(--shadow);
  color: #fff;
  padding: 16px 8px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  transition: transform 0.15s ease;
}
.writing-select-card:hover { transform: translateY(-4px); }
.writing-select-card .letter {
  font-family: 'Baloo 2', sans-serif;
  font-weight: 800;
  font-size: 2rem;
}
.writing-select-card .stars {
  font-size: 0.85rem;
  min-height: 1.1em;
  color: var(--gold);
}

.writing-canvas-wrap {
  max-width: 420px;
  margin: 0 auto;
  text-align: center;
}

.writing-canvas-stack {
  position: relative;
  width: fit-content;
  margin: 0 auto 20px;
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow);
  background: #fff;
  touch-action: none;
  line-height: 0;
}

.writing-canvas-stack canvas {
  display: block;
}

.writing-canvas-stack #ink-canvas {
  position: absolute;
  inset: 0;
  cursor: crosshair;
}

.writing-toolbar {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 18px;
}

.writing-nav {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

/* ---------------------------------------------------------------------- */
/* Topic grid                                                             */
/* ---------------------------------------------------------------------- */
.topic-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 20px;
}

.topic-card {
  border-radius: var(--radius-md);
  padding: 24px 16px;
  text-align: center;
  box-shadow: var(--shadow);
  transition: transform 0.15s ease;
  color: var(--text);
}

.topic-card:hover { transform: translateY(-5px) rotate(-1deg); }
.topic-card .icon { font-size: 3rem; display: block; }
.topic-card .name { font-weight: 800; font-size: 1.1rem; margin-top: 8px; }
.topic-card .name-ja { color: var(--text-soft); font-size: 0.85rem; }
.topic-card .mastered-tag { margin-top: 8px; font-size: 0.8rem; font-weight: 700; color: #2f8f4e; }

/* ---------------------------------------------------------------------- */
/* Flashcards                                                             */
/* ---------------------------------------------------------------------- */
.flashcard-wrap {
  max-width: 420px;
  margin: 0 auto;
  text-align: center;
}

.flashcard {
  perspective: 1200px;
  height: 300px;
  margin-bottom: 20px;
}

.flashcard-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform 0.5s;
  transform-style: preserve-3d;
  cursor: pointer;
}

.flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }

.flashcard-face {
  position: absolute;
  inset: 0;
  border-radius: var(--radius-lg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  backface-visibility: hidden;
  box-shadow: var(--shadow);
  padding: 20px;
}

.flashcard-front { background: linear-gradient(160deg, #fff, var(--pink-soft)); }
.flashcard-front .emoji { font-size: 5rem; }
.flashcard-front .vi { font-size: 2rem; font-weight: 800; font-family: 'Baloo 2', sans-serif; margin-top: 10px; }

.flashcard-back {
  background: linear-gradient(160deg, var(--pink), var(--lavender));
  color: #fff;
  transform: rotateY(180deg);
}
.flashcard-back .ja { font-size: 1.8rem; font-weight: 700; }
.flashcard-back .hint { margin-top: 10px; font-size: 0.9rem; opacity: 0.85; }

.flashcard-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin-bottom: 18px;
}

.flashcard-dots {
  display: flex;
  gap: 6px;
  justify-content: center;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.flashcard-dots span {
  width: 10px; height: 10px; border-radius: 50%; background: #f7dcee;
}
.flashcard-dots span.active { background: var(--pink); }

.sound-buttons { display: flex; gap: 10px; justify-content: center; margin-bottom: 10px; flex-wrap: wrap; }

.game-launch-row {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 24px;
}

/* ---------------------------------------------------------------------- */
/* Game common                                                            */
/* ---------------------------------------------------------------------- */
.game-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: 700px;
  margin: 0 auto 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.game-stat {
  background: #fff;
  border-radius: 999px;
  padding: 8px 16px;
  font-weight: 700;
  box-shadow: var(--shadow);
}

/* Matching game */
.matching-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  max-width: 620px;
  margin: 0 auto;
}

.match-card {
  aspect-ratio: 1;
  border-radius: var(--radius-sm);
  background: linear-gradient(135deg, var(--lavender), var(--pink));
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 1.8rem;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: transform 0.15s ease;
  text-align: center;
  padding: 6px;
}

.match-card .content { display: none; font-size: 1.3rem; font-weight: 700; }
.match-card.revealed .content, .match-card.matched .content { display: block; }
.match-card.revealed .back-icon, .match-card.matched .back-icon { display: none; }
.match-card:hover { transform: scale(1.04); }
.match-card.matched { background: linear-gradient(135deg, var(--green), #2fb673); cursor: default; opacity: 0.85; }
.match-card.wrong { animation: shake 0.4s; }

/* Quiz game */
.quiz-prompt {
  text-align: center;
  background: #fff;
  border-radius: var(--radius-lg);
  padding: 30px;
  max-width: 500px;
  margin: 0 auto 24px;
  box-shadow: var(--shadow);
}
.quiz-prompt .emoji-big { font-size: 5rem; }
.quiz-prompt .ja-text { font-size: 1.8rem; font-weight: 700; color: var(--pink-deep); }

.quiz-options {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
  max-width: 500px;
  margin: 0 auto;
}

.quiz-option {
  background: #fff;
  border: 3px solid #f7dcee;
  border-radius: var(--radius-md);
  padding: 18px;
  font-weight: 700;
  font-size: 1.1rem;
  text-align: center;
  box-shadow: var(--shadow);
  min-height: 44px;
}

.quiz-option:hover { border-color: var(--pink); }
.quiz-option.correct { background: var(--green); color: #fff; border-color: var(--green); }
.quiz-option.incorrect { background: var(--red); color: #fff; border-color: var(--red); }

/* Spelling game */
.spelling-target {
  text-align: center;
  margin-bottom: 20px;
}
.spelling-target .emoji-big { font-size: 5rem; }
.spelling-target .ja-text { color: var(--text-soft); font-weight: 700; }

.spelling-slots {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  margin: 20px 0;
  min-height: 60px;
}

.spelling-slot {
  width: 46px;
  height: 54px;
  border-bottom: 4px solid var(--lavender);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.6rem;
  font-weight: 800;
  font-family: 'Baloo 2', sans-serif;
}

.spelling-slot.wrong {
  animation: shake 0.4s;
  border-color: var(--red);
}

.spelling-letters {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.letter-btn {
  width: 50px;
  height: 50px;
  border-radius: var(--radius-sm);
  background: var(--gold);
  font-weight: 800;
  font-size: 1.3rem;
  font-family: 'Baloo 2', sans-serif;
  box-shadow: var(--shadow);
}
.letter-btn:hover { transform: translateY(-2px); }
.letter-btn.used { visibility: hidden; }

/* Result modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(74, 46, 69, 0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
  overflow-y: auto;
}

.modal-box {
  background: #fff;
  border-radius: var(--radius-lg);
  padding: 34px 30px;
  text-align: center;
  max-width: 380px;
  width: 100%;
  box-shadow: 0 10px 0 rgba(0,0,0,0.1);
  animation: pop 0.35s ease;
  margin: auto;
}

.modal-box .big-emoji { font-size: 4rem; }
.modal-box .stars-earned { font-size: 2.2rem; margin: 10px 0; }
.modal-box .score-text { color: var(--text-soft); font-weight: 700; margin-bottom: 18px; }
.modal-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

/* Progress page */
.progress-summary {
  display: flex;
  justify-content: center;
  gap: 30px;
  flex-wrap: wrap;
  margin-bottom: 30px;
}

.progress-stat {
  background: #fff;
  border-radius: var(--radius-md);
  padding: 20px 30px;
  text-align: center;
  box-shadow: var(--shadow);
}
.progress-stat .num { font-size: 2rem; font-weight: 800; color: var(--pink-deep); }
.progress-stat .label { color: var(--text-soft); font-weight: 700; }

.progress-topic {
  background: #fff;
  border-radius: var(--radius-md);
  padding: 16px 20px;
  margin-bottom: 12px;

.progress-bar-track {

}
.progress-bar-fill {
  height: 100%;

  transition: width 0.4s ease;
}

/* ---------------------------------------------------------------------- */
/* Animations                                                             */
/* ---------------------------------------------------------------------- */
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

@keyframes pop {
  0% { transform: scale(0.7); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

@keyframes twinkle {
  0%, 100% { opacity: 0.4; transform: scale(0.9); }
  50% { opacity: 1; transform: scale(1.15); }
}

@keyframes floaty {
  0%, 100% { transform: translateY(0) rotate(0); }
  50% { transform: translateY(-8px) rotate(-3deg); }
}

@keyframes popBounce {
  0% { transform: scale(0.4) rotate(-8deg); opacity: 0; }
  60% { transform: scale(1.15) rotate(4deg); opacity: 1; }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}

@keyframes wiggle {
  0%, 100% { transform: rotate(0); }
  25% { transform: rotate(-10deg); }
  75% { transform: rotate(10deg); }
}

const VOCAB_BY_ID = {};
VOCABULARY.forEach((t) => { VOCAB_BY_ID[t.id] = t; });

const AVATARS = ["👸", "🧚‍♀️", "🦄", "🧜‍♀️", "🎀", "🐰", "🐱", "🐻", "🐨", "🦋"];
const GAME_TYPES = ["matching", "quiz", "spelling"];
const MAX_STARS_PER_GAME = 3;
const MILESTONE_BADGES = [
  [10, "🌸", "Công chúa tập sự"],
  [25, "🎀", "Công chúa chăm chỉ"],
  [45, "💎", "Công chúa thông thái"],
  [70, "👑", "Nữ hoàng tiếng Việt"],
];
const WRITING_MILESTONES = [
  [5, "✏️", "Bé mới cầm bút"],
  [15, "✍️", "Bé viết chăm chỉ"],
  [ALPHABET.length, "🖋️", "Chuyên gia viết chữ"],
];

/* ==========================================================================
   2. LƯU TRỮ (localStorage thay cho Flask + SQLite)
   ========================================================================== */
const STORAGE_KEYS = {
  profiles: "vietkid_profiles",
  progress: "vietkid_progress",
  writingProgress: "vietkid_writing_progress",
  currentProfile: "vietkid_profile_id",
};

function loadProfiles() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEYS.profiles) || "[]"); }
  catch (e) { return []; }
}
function saveProfilesList(list) { localStorage.setItem(STORAGE_KEYS.profiles, JSON.stringify(list)); }
function loadProgressRows() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEYS.progress) || "[]"); }
  catch (e) { return []; }
}
function saveProgressRows(list) { localStorage.setItem(STORAGE_KEYS.progress, JSON.stringify(list)); }
function loadWritingRows() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEYS.writingProgress) || "[]"); }
  catch (e) { return []; }
}
function saveWritingRows(list) { localStorage.setItem(STORAGE_KEYS.writingProgress, JSON.stringify(list)); }
function nextId(list) { return list.reduce((max, item) => Math.max(max, item.id), 0) + 1; }

const Store = {
  getAvatars() { return AVATARS; },

  createProfile(name, avatar) {
    name = (name || "").trim();
    if (!name) throw new Error("Vui lòng nhập tên bé");
    if (name.length > 40) throw new Error("Tên quá dài");
    const profiles = loadProfiles();
    const profile = { id: nextId(profiles), name, avatar: avatar || AVATARS[0], createdAt: new Date().toISOString() };
    profiles.push(profile);
    saveProfilesList(profiles);
    return { id: profile.id, name: profile.name, avatar: profile.avatar, total_stars: 0 };
  },

  listProfiles() {
    return loadProfiles().map((p) => ({
      id: p.id, name: p.name, avatar: p.avatar,
      total_stars: this.computeSummary(p.id).total_stars,
    }));
  },

  getProfile(id) {
    const p = loadProfiles().find((x) => x.id === id);
    if (!p) return null;
    return Object.assign({ id: p.id, name: p.name, avatar: p.avatar }, this.computeSummary(id));
  },

  deleteProfile(id) {
    saveProfilesList(loadProfiles().filter((p) => p.id !== id));
    saveProgressRows(loadProgressRows().filter((r) => r.profileId !== id));
    saveWritingRows(loadWritingRows().filter((r) => r.profileId !== id));
  },

  saveProgress(profileId, topicId, gameType, score, stars) {
    stars = Math.max(0, Math.min(MAX_STARS_PER_GAME, Math.round(stars)));
    score = Math.round(score);
    const list = loadProgressRows();
    const existing = list.find((r) => r.profileId === profileId && r.topicId === topicId && r.gameType === gameType);
    if (existing) {
      existing.score = Math.max(existing.score, score);
      existing.stars = Math.max(existing.stars, stars);
      existing.updatedAt = new Date().toISOString();
    } else {
      list.push({ profileId, topicId, gameType, score, stars, updatedAt: new Date().toISOString() });
    }
    saveProgressRows(list);
    return this.computeSummary(profileId);
  },

  saveWritingProgress(profileId, letterIndex, score, stars) {
    stars = Math.max(0, Math.min(MAX_STARS_PER_GAME, Math.round(stars)));
    score = Math.max(0, Math.min(100, Math.round(score)));
    const list = loadWritingRows();
    const existing = list.find((r) => r.profileId === profileId && r.letterIndex === letterIndex);
    if (existing) {
      existing.score = Math.max(existing.score, score);
      existing.stars = Math.max(existing.stars, stars);
      existing.updatedAt = new Date().toISOString();
    } else {
      list.push({ profileId, letterIndex, score, stars, updatedAt: new Date().toISOString() });
    }
    saveWritingRows(list);
    return this.computeSummary(profileId);
  },

  computeSummary(profileId) {
    const rows = loadProgressRows().filter((r) => r.profileId === profileId);
    const writingRows = loadWritingRows().filter((r) => r.profileId === profileId);
    const byTopic = {};
    let vocabStars = 0;
    rows.forEach((r) => {
      vocabStars += r.stars;
      byTopic[r.topicId] = byTopic[r.topicId] || {};
      byTopic[r.topicId][r.gameType] = { score: r.score, stars: r.stars };
    });

    const topics = {};
    const badges = [];
    VOCABULARY.forEach((topic) => {
      const games = byTopic[topic.id] || {};
      const starsSum = Object.keys(games).reduce((s, gt) => s + games[gt].stars, 0);
      const mastered = GAME_TYPES.every((gt) => games[gt] && games[gt].stars >= 2);
      topics[topic.id] = {
        name: topic.name, icon: topic.icon, games: games,
        stars: starsSum, max_stars: GAME_TYPES.length * MAX_STARS_PER_GAME, mastered: mastered,
      };
      if (mastered) badges.push({ id: "master_" + topic.id, icon: topic.icon, label: "Chuyên gia " + topic.name });
    });

    const writingLetters = {};
    let writingStars = 0;
    writingRows.forEach((r) => {
      writingStars += r.stars;
      writingLetters[r.letterIndex] = { score: r.score, stars: r.stars };
    });
    const writingPracticedCount = Object.keys(writingLetters).length;

    WRITING_MILESTONES.forEach(([threshold, icon, label]) => {
      if (writingPracticedCount >= threshold) badges.push({ id: "writing_" + threshold, icon: icon, label: label });
    });

    const totalStars = vocabStars + writingStars;

    MILESTONE_BADGES.forEach(([threshold, icon, label]) => {
      if (totalStars >= threshold) badges.push({ id: "milestone_" + threshold, icon: icon, label: label });
    });

    return {
      total_stars: totalStars,
      topics: topics,
      writing: {
        letters: writingLetters,
        practiced_count: writingPracticedCount,
        total_letters: ALPHABET.length,
        stars: writingStars,
        max_stars: ALPHABET.length * MAX_STARS_PER_GAME,
      },
      badges: badges,
    };
  },

  getCurrentProfileId() {
    const id = localStorage.getItem(STORAGE_KEYS.currentProfile);
    return id ? parseInt(id, 10) : null;
  },
  setCurrentProfileId(id) { localStorage.setItem(STORAGE_KEYS.currentProfile, String(id)); },
  clearCurrentProfile() { localStorage.removeItem(STORAGE_KEYS.currentProfile); },
};

/* ==========================================================================
   3. PHÁT ÂM (Web Speech API) + ÂM THANH / CONFETTI
   ========================================================================== */
const VietKidSpeech = (() => {
  let voices = [];
  function loadVoices() { if ("speechSynthesis" in window) voices = window.speechSynthesis.getVoices(); }
  if ("speechSynthesis" in window) {
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }
  function pickVoice(lang) {
    const exact = voices.find((v) => v.lang === lang);
    if (exact) return exact;
    const prefix = lang.split("-")[0];
    return voices.find((v) => v.lang && v.lang.startsWith(prefix)) || null;
  }
  function speak(text, lang) {
    if (!("speechSynthesis" in window) || !text) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = lang;
    utter.rate = 0.82;
    utter.pitch = 1.15;
    const voice = pickVoice(lang);
    if (voice) utter.voice = voice;
    window.speechSynthesis.speak(utter);
  }
  return {
    speakVi: (text) => speak(text, "vi-VN"),
    speakJa: (text) => speak(text, "ja-JP"),
  };
})();

const VietKidSound = (() => {
  let ctx = null;
  function getCtx() {
    if (!ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return null;
      ctx = new AudioCtx();
    }
    return ctx;
  }
  function tone(freq, start, duration, type, gain) {
    const audio = getCtx();
    if (!audio) return;
    const osc = audio.createOscillator();
    const g = audio.createGain();
    osc.type = type || "sine";
    osc.frequency.value = freq;
    g.gain.value = gain || 0.15;
    osc.connect(g);
    g.connect(audio.destination);
    osc.start(audio.currentTime + start);
    g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + start + duration);
    osc.stop(audio.currentTime + start + duration + 0.02);
  }
  function playCorrect() { tone(523.25, 0, 0.12); tone(659.25, 0.1, 0.12); tone(783.99, 0.2, 0.2); }
  function playWrong() { tone(220, 0, 0.25, "sawtooth", 0.1); }
  function playClick() { tone(440, 0, 0.06, "triangle", 0.08); }
  function playCheer() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.1, 0.18)); }
  const CONFETTI_EMOJI = ["🎉", "⭐", "🎊", "🌟", "✨", "👑", "💖", "🎀"];
  function confettiBurst(count) {
    count = count || 24;
    for (let i = 0; i < count; i++) {
      const el = document.createElement("div");
      el.className = "confetti";
      el.textContent = CONFETTI_EMOJI[Math.floor(Math.random() * CONFETTI_EMOJI.length)];
      el.style.left = Math.random() * 100 + "vw";
      el.style.animationDuration = 1.6 + Math.random() * 1.4 + "s";
      el.style.fontSize = 1 + Math.random() * 1.4 + "rem";
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3200);
    }
  }
  return { playCorrect, playWrong, playClick, playCheer, confettiBurst };
})();

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderHeader() {
  const parts = parseHash();
  const nav = document.getElementById("main-nav");
  [...nav.children].forEach((a) => {
    const r = a.getAttribute("data-route");
    const isActive = (r === "" && parts.length === 0) || (r !== "" && parts[0] === r);
    a.classList.toggle("active", isActive);
  });

  const slot = document.getElementById("header-profile-slot");

    slot.innerHTML = '<a href="#/" class="btn btn-outline" style="background:transparent;border-color:#fff;color:#fff;">Chọn hồ sơ bé</a>';
    return;
  }
  const profile = Store.getProfile(profileId);

function parseHash() {
  let h = location.hash.replace(/^#/, "");
  if (!h || h === "/") return [];
  return h.split("/").filter(Boolean);
}

function route() {
  window.scrollTo(0, 0);
  const parts = parseHash();
  renderHeader();
  if (parts.length === 0) return renderHome();
  if (parts[0] === "alphabet") return renderAlphabet();
  if (parts[0] === "writing" && parts.length === 1) return renderWritingList();
  if (parts[0] === "writing" && parts.length === 2) return renderWritingPractice(parts[1]);
  if (parts[0] === "topics" && parts.length === 1) return renderTopics();
  if (parts[0] === "topics" && parts.length === 2) return renderVocabulary(parts[1]);
  if (parts[0] === "games" && parts.length === 3) return renderGame(parts[1], parts[2]);
  if (parts[0] === "progress") return renderProgress();
  return renderNotFound();
}

function renderWritingPractice(idxParam) {

  if (isNaN(letterIndex) || letterIndex < 0 || letterIndex >= ALPHABET.length) return renderNotFound();
  if (!requireProfile()) return;

  const letter = ALPHABET[letterIndex];
  const total = ALPHABET.length;
  const prevLink = letterIndex > 0 ? '<a class="btn" href="#/writing/' + (letterIndex - 1) + '">⬅️ Chữ trước</a>' : "<span></span>";
  const nextLink = letterIndex < total - 1 ? '<a class="btn" href="#/writing/' + (letterIndex + 1) + '">Chữ tiếp ➡️</a>' : "";
  const nextModalLink = letterIndex < total - 1
    ? '<a class="btn btn-green" href="#/writing/' + (letterIndex + 1) + '">➡️ Chữ tiếp theo</a>'
    : "";

  app.innerHTML =
    '<h1 class="page-title">✍️ Tập viết chữ "' + letter.letter + '"</h1>' +
    '<p class="page-subtitle">Dùng ngón tay hoặc chuột tô đầy vào hình chữ mờ bên dưới nhé!</p>' +
    '<div class="game-header">' +
    '  <div class="game-stat">🔤 Chữ ' + (letterIndex + 1) + ' / ' + total + '</div>' +
    '  <div class="game-stat" id="letter-stars-stat">⭐ Chưa tập</div>' +
    '  <a class="btn btn-outline" href="#/writing">⬅️ Danh sách chữ</a>' +
    '</div>' +
    '<div class="writing-canvas-wrap">' +
    '  <div class="writing-canvas-stack emoji-pop" id="canvas-stack">' +
    '    <canvas id="guide-canvas"></canvas>' +
    '    <canvas id="ink-canvas"></canvas>' +
    '  </div>' +
    '  <div class="writing-toolbar">' +
    '    <button class="btn btn-blue" id="speak-btn">🔊 Nghe</button>' +
    '    <button class="btn btn-outline" id="clear-btn">🧹 Xóa</button>' +
    '    <button class="btn btn-primary" id="check-btn">✅ Kiểm tra</button>' +
    '  </div>' +
    '  <div class="writing-nav">' + prevLink + nextLink + '</div>' +
    '</div>' +
    '<div id="result-modal" class="modal-overlay" style="display:none;">' +
    '  <div class="modal-box">' +
    '    <div class="big-emoji" id="modal-emoji">🌟</div>' +
    '    <h2 id="modal-title">Giỏi quá!</h2>' +
    '    <div class="stars-earned" id="stars-earned"></div>' +
    '    <div class="score-text" id="score-text"></div>' +
    '    <div class="modal-actions">' +
    '      <button class="btn btn-primary" id="retry-btn">🔄 Tô lại</button>' +
    nextModalLink +
    '      <a class="btn btn-outline" href="#/writing">🔤 Danh sách chữ</a>' +
    '    </div>' +
    '  </div>' +
    '</div>';

  const INK_COLOR = "#e0338f";
  const DISPLAY_SIZE = Math.min(320, window.innerWidth - 64);
  let guideCtx, inkCtx, dpr, hasInk = false, drawing = false;

  function setupCanvas(canvas) {
    dpr = window.devicePixelRatio || 1;
    canvas.width = DISPLAY_SIZE * dpr;
    canvas.height = DISPLAY_SIZE * dpr;
    canvas.style.width = DISPLAY_SIZE + "px";
    canvas.style.height = DISPLAY_SIZE + "px";
    const ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);
    return ctx;
  }

  function drawGuide() {
    guideCtx.clearRect(0, 0, DISPLAY_SIZE, DISPLAY_SIZE);
    guideCtx.fillStyle = "rgba(180, 123, 240, 0.32)";
    guideCtx.font = "700 " + Math.floor(DISPLAY_SIZE * 0.7) + "px 'Baloo 2', sans-serif";
    guideCtx.textAlign = "center";
    guideCtx.textBaseline = "middle";
    guideCtx.fillText(letter.letter, DISPLAY_SIZE / 2, DISPLAY_SIZE / 2 + DISPLAY_SIZE * 0.05);
  }

  function clearInk() {
    inkCtx.clearRect(0, 0, DISPLAY_SIZE, DISPLAY_SIZE);
    hasInk = false;
  }

  function pointerPos(e) {
    const rect = document.getElementById("ink-canvas").getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function startDraw(e) {
    drawing = true;
    hasInk = true;
    const p = pointerPos(e);
    inkCtx.beginPath();
    inkCtx.moveTo(p.x, p.y);
    e.target.setPointerCapture(e.pointerId);
    e.preventDefault();
  }

  function moveDraw(e) {
    if (!drawing) return;
    const p = pointerPos(e);
    inkCtx.lineTo(p.x, p.y);
    inkCtx.stroke();
    e.preventDefault();
  }

  function endDraw() { drawing = false; }

  function computeCoverage() {
    const guideData = guideCtx.getImageData(0, 0, DISPLAY_SIZE * dpr, DISPLAY_SIZE * dpr).data;
    const inkData = inkCtx.getImageData(0, 0, DISPLAY_SIZE * dpr, DISPLAY_SIZE * dpr).data;
    let guideCount = 0, overlapCount = 0;
    for (let i = 3; i < guideData.length; i += 4) {
      if (guideData[i] > 20) {
        guideCount++;
        if (inkData[i] > 20) overlapCount++;
      }
    }
    return guideCount === 0 ? 0 : overlapCount / guideCount;
  }

  function starsForRatio(ratio) {
    if (ratio >= 0.35) return 3;
    if (ratio >= 0.18) return 2;
    if (ratio >= 0.05) return 1;
    return 0;
  }

  function checkWriting() {
    if (!hasInk) {
      alert("Bé hãy tô vào bên trong hình chữ mờ trước đã nhé! 🖍️");
      return;
    }
    const ratio = computeCoverage();
    const stars = starsForRatio(ratio);
    const score = Math.round(ratio * 100);

    const messages = {
      0: ["🖍️", "Bé thử tô lại nhé!", "Tô đầy vào bên trong hình chữ mờ mờ đó."],
      1: ["🙂", "Cố lên nhé!", "Bé tô được một phần rồi, cố thêm chút nữa!"],
      2: ["😊", "Giỏi lắm!", "Bé tô khá đầy đủ rồi đó!"],
      3: ["🌟", "Tuyệt vời!", "Bé đã tô rất đẹp và đầy đủ!"],
    };
    const m = messages[stars];
    document.getElementById("modal-emoji").textContent = m[0];
    document.getElementById("modal-title").textContent = m[1];
    document.getElementById("stars-earned").textContent = "⭐".repeat(stars) + "☆".repeat(3 - stars);
    document.getElementById("score-text").textContent = m[2] + " (" + score + "%)";
    document.getElementById("result-modal").style.display = "flex";

    if (stars >= 2) { VietKidSound.playCheer(); VietKidSound.confettiBurst(); }
    else if (stars === 1) VietKidSound.playClick();
    else VietKidSound.playWrong();

    const profileId = Store.getCurrentProfileId();
    if (profileId) {
      Store.saveWritingProgress(profileId, letterIndex, score, stars);
      updateStarsStat();
      renderHeader();
    }
  }

  function updateStarsStat() {
    const profileId = Store.getCurrentProfileId();
    const statEl = document.getElementById("letter-stars-stat");
    if (!profileId) { statEl.textContent = "⭐ Chưa tập"; return; }
    const summary = Store.computeSummary(profileId);
    const info = summary.writing.letters[letterIndex];
    statEl.textContent = info ? "⭐ " + info.stars + "/3 sao" : "⭐ Chưa tập";
  }

  guideCtx = setupCanvas(document.getElementById("guide-canvas"));
  inkCtx = setupCanvas(document.getElementById("ink-canvas"));
  inkCtx.strokeStyle = INK_COLOR;
  inkCtx.lineWidth = Math.max(12, DISPLAY_SIZE * 0.05);
  inkCtx.lineCap = "round";
  inkCtx.lineJoin = "round";
  drawGuide();

  const inkCanvas = document.getElementById("ink-canvas");
  inkCanvas.addEventListener("pointerdown", startDraw);
  inkCanvas.addEventListener("pointermove", moveDraw);
  inkCanvas.addEventListener("pointerup", endDraw);
  inkCanvas.addEventListener("pointercancel", endDraw);
  inkCanvas.addEventListener("pointerleave", endDraw);

  document.getElementById("speak-btn").addEventListener("click", () => VietKidSpeech.speakVi(letter.word));
  document.getElementById("clear-btn").addEventListener("click", clearInk);
  document.getElementById("check-btn").addEventListener("click", checkWriting);
  document.getElementById("retry-btn").addEventListener("click", () => {
    document.getElementById("result-modal").style.display = "none";
    clearInk();
  });

  updateStarsStat();
}

/* ==========================================================================
   8. TRÒ CHƠI (nối cặp / đố vui / ghép chữ)
   ========================================================================== */
function renderGame(topicId, gameType) {
  const topic = VOCAB_BY_ID[topicId];
  if (!topic || GAME_TYPES.indexOf(gameType) === -1) return renderNotFound();
  if (!requireProfile()) return;

  if (gameType === "matching") return renderMatchingGame(topic);
  if (gameType === "quiz") return renderQuizGame(topic);
  if (gameType === "spelling") return renderSpellingGame(topic);
}

function gameShell(topic, titleIcon, titleText, subtitle, bodyHtml, modalIcon, modalTitle) {
  app.innerHTML =
    '<h1 class="page-title">' + titleIcon + ' ' + titleText + ': ' + topic.name + '</h1>' +
    '<p class="page-subtitle">' + subtitle + '</p>' +

    '  <div id="game-stats"></div>' +
    '  <a class="btn btn-outline" href="#/topics/' + topic.id + '">⬅️ Quay lại</a>' +
    '</div>' +
    bodyHtml +
    '<div id="result-modal" class="modal-overlay" style="display:none;">' +
    '  <div class="modal-box">' +
    '    <div class="big-emoji">' + modalIcon + '</div>' +
    '    <h2>' + modalTitle + '</h2>' +
    '    <div class="stars-earned" id="stars-earned"></div>' +
    '    <div class="score-text" id="score-text"></div>' +
    '    <div class="modal-actions">' +
    '      <button class="btn btn-primary" id="retry-btn">🔄 Chơi lại</button>' +
    '      <a class="btn btn-outline" href="#/topics/' + topic.id + '">📚 Về chủ đề</a>' +
    '    </div>' +
    '  </div>' +
    '</div>';
}

/* ---- Nối cặp (matching) ---- */
function renderMatchingGame(topic) {
  gameShell(
    topic, "🧩", "Nối cặp", "Lật 2 thẻ giống nhau (từ và hình) để ghép cặp nhé!",
    '<div id="grid" class="matching-grid"></div>',
    "🎉", "Giỏi quá!"
  );

  const allWords = topic.words;
  const PAIR_COUNT = Math.min(6, allWords.length);
  let moves = 0, matchesFound = 0, lockBoard = false, firstCard = null;

  function updateStats() {
    document.getElementById("game-stats").innerHTML =
      '<div class="game-stat">🔁 Lượt lật: ' + moves + '</div>' +
      '<div class="game-stat" style="margin-left:8px;">✅ Cặp đúng: ' + matchesFound + ' / ' + PAIR_COUNT + '</div>';
  }

  function buildDeck() {
    const chosen = shuffle(allWords).slice(0, PAIR_COUNT);
    const cards = [];
    chosen.forEach((w, i) => {
      cards.push({ pairId: i, display: w.emoji });
      cards.push({ pairId: i, display: w.vi });
    });
    return shuffle(cards);
  }

  function renderGrid() {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    const deck = buildDeck();
    deck.forEach((cardData) => {
      const el = document.createElement("div");
      el.className = "match-card";
      el.dataset.pairId = cardData.pairId;
      el.innerHTML = '<span class="back-icon">❓</span><span class="content">' + cardData.display + '</span>';
      el.addEventListener("click", () => onCardClick(el));
      grid.appendChild(el);
    });
  }

  function onCardClick(el) {
    if (lockBoard || el.classList.contains("revealed") || el.classList.contains("matched")) return;
    el.classList.add("revealed");
    VietKidSound.playClick();
    if (!firstCard) { firstCard = el; return; }

    moves++;
    updateStats();

    if (firstCard.dataset.pairId === el.dataset.pairId && firstCard !== el) {
      firstCard.classList.add("matched");
      el.classList.add("matched");
      matchesFound++;
      updateStats();
      firstCard = null;
      VietKidSound.playCorrect();
      if (matchesFound === PAIR_COUNT) setTimeout(finishGame, 500);
    } else {
      lockBoard = true;
      VietKidSound.playWrong();
      const wrongFirst = firstCard, wrongSecond = el;
      wrongFirst.classList.add("wrong");
      wrongSecond.classList.add("wrong");
      setTimeout(() => {
        wrongFirst.classList.remove("revealed", "wrong");
        wrongSecond.classList.remove("revealed", "wrong");
        firstCard = null;
        lockBoard = false;
      }, 800);
    }
  }

  function finishGame() {
    const minMoves = PAIR_COUNT;
    let stars;
    if (moves <= minMoves * 1.4) stars = 3;
    else if (moves <= minMoves * 2.2) stars = 2;
    else stars = 1;

    document.getElementById("stars-earned").textContent = "⭐".repeat(stars) + "☆".repeat(3 - stars);
    document.getElementById("score-text").textContent = "Hoàn thành với " + moves + " lượt lật!";
    document.getElementById("result-modal").style.display = "flex";
    VietKidSound.playCheer();
    VietKidSound.confettiBurst();

    const profileId = Store.getCurrentProfileId();
    if (profileId) Store.saveProgress(profileId, topic.id, "matching", moves, stars);
    renderHeader();
  }

  function resetGame() {
    moves = 0; matchesFound = 0; firstCard = null; lockBoard = false;
    document.getElementById("result-modal").style.display = "none";
    updateStats();
    renderGrid();
  }

  document.getElementById("retry-btn").addEventListener("click", resetGame);
  updateStats();
  renderGrid();
}

/* ---- Đố vui (quiz) ---- */
function renderQuizGame(topic) {
  gameShell(
    topic, "❓", "Đố vui", "Xem hình và nghĩa tiếng Nhật, chọn từ tiếng Việt đúng nhé!",
    '<div class="quiz-prompt">' +
    '  <div class="emoji-big" id="prompt-emoji"></div>' +
    '  <div class="ja-text" id="prompt-ja"></div>' +
    '  <button class="btn btn-blue" id="hint-btn" style="margin-top:14px;">🔊 Nghe gợi ý</button>' +
    '</div>' +
    '<div class="quiz-options" id="options"></div>',
    "👑", "Xong rồi!"
  );

  const allWords = topic.words;
  let order = [], qIndex = 0, correctCount = 0, answered = false;

  function updateStats() {
    document.getElementById("game-stats").innerHTML =
      '<div class="game-stat">📋 Câu: ' + (qIndex + 1) + ' / ' + order.length + '</div>' +
      '<div class="game-stat" style="margin-left:8px;">✅ Đúng: ' + correctCount + '</div>';
  }

  function buildOptions(correctWord) {
    const distractors = shuffle(allWords.filter((w) => w.vi !== correctWord.vi)).slice(0, 3);
    return shuffle([correctWord].concat(distractors));
  }

  function renderQuestion() {
    answered = false;
    const word = order[qIndex];
    updateStats();
    document.getElementById("prompt-emoji").textContent = word.emoji;
    document.getElementById("prompt-ja").textContent = word.ja;
    vietkidPopEmoji(document.getElementById("prompt-emoji"));

    const optionsEl = document.getElementById("options");
    optionsEl.innerHTML = "";
    buildOptions(word).forEach((opt) => {
      const btn = document.createElement("button");
      btn.className = "quiz-option";
      btn.textContent = opt.vi;
      btn.addEventListener("click", () => onAnswer(btn, opt, word));
      optionsEl.appendChild(btn);
    });
  }

  function onAnswer(btn, opt, correctWord) {
    if (answered) return;
    answered = true;
    const isCorrect = opt.vi === correctWord.vi;
    btn.classList.add(isCorrect ? "correct" : "incorrect");
    if (isCorrect) {
      correctCount++;
      updateStats();
      VietKidSound.playCorrect();
    } else {
      VietKidSound.playWrong();
      [...document.getElementById("options").children].forEach((c) => {
        if (c.textContent === correctWord.vi) c.classList.add("correct");
      });
    }
    VietKidSpeech.speakVi(correctWord.vi);

    setTimeout(() => {
      qIndex++;
      if (qIndex < order.length) renderQuestion();
      else finishGame();
    }, 1300);
  }

  function finishGame() {
    const pct = correctCount / order.length;
    let stars;
    if (pct >= 0.9) stars = 3;
    else if (pct >= 0.6) stars = 2;
    else stars = 1;

    document.getElementById("stars-earned").textContent = "⭐".repeat(stars) + "☆".repeat(3 - stars);
    document.getElementById("score-text").textContent = "Đúng " + correctCount + "/" + order.length + " câu!";
    document.getElementById("result-modal").style.display = "flex";
    VietKidSound.playCheer();
    VietKidSound.confettiBurst();

    const profileId = Store.getCurrentProfileId();
    if (profileId) Store.saveProgress(profileId, topic.id, "quiz", correctCount, stars);
    renderHeader();
  }

  function startGame() {
    order = shuffle(allWords);
    qIndex = 0; correctCount = 0;
    document.getElementById("result-modal").style.display = "none";
    renderQuestion();
  }

  document.getElementById("hint-btn").addEventListener("click", () => VietKidSpeech.speakVi(order[qIndex].vi));
  document.getElementById("retry-btn").addEventListener("click", startGame);
  startGame();
}

/* ---- Ghép chữ (spelling) ---- */
function renderSpellingGame(topic) {
  gameShell(
    topic, "🔡", "Ghép chữ", "Xem hình rồi bấm các chữ cái theo đúng thứ tự để ghép thành từ!",
    '<div class="spelling-target">' +
    '  <div class="emoji-big" id="prompt-emoji"></div>' +
    '  <div class="ja-text" id="prompt-ja"></div>' +
    '  <button class="btn btn-blue" id="hint-btn" style="margin-top:10px;">🔊 Nghe từ</button>' +
    '</div>' +
    '<div class="spelling-slots" id="slots"></div>' +
    '<div class="spelling-letters" id="letters"></div>' +
    '<div style="text-align:center;"><button class="btn btn-outline" id="clear-btn">🧹 Xóa hết</button></div>',
    "💖", "Bé giỏi quá!"
  );

  const allWords = topic.words.filter((w) => w.vi.indexOf(" ") === -1);
  let order = [], qIndex = 0, mistakesTotal = 0, currentAttemptWrong = false, correctCount = 0;
  let targetChars = [], filled = [], letterState = [];

  if (allWords.length === 0) {
    app.querySelector(".spelling-target").insertAdjacentHTML(
      "afterend",
      '<p class="page-subtitle">Chủ đề này chưa có từ phù hợp cho trò chơi ghép chữ.</p>'
    );
    document.getElementById("slots").style.display = "none";
    document.getElementById("letters").style.display = "none";
    document.getElementById("hint-btn").style.display = "none";
    document.getElementById("clear-btn").style.display = "none";
    return;
  }

  function updateStats() {
    document.getElementById("game-stats").innerHTML =
      '<div class="game-stat">📋 Từ: ' + (qIndex + 1) + ' / ' + order.length + '</div>' +
      '<div class="game-stat" style="margin-left:8px;">✅ Đúng ngay: ' + correctCount + '</div>';
  }

  function renderQuestion() {
    const word = order[qIndex];
    updateStats();
    document.getElementById("prompt-emoji").textContent = word.emoji;
    document.getElementById("prompt-ja").textContent = word.ja;
    vietkidPopEmoji(document.getElementById("prompt-emoji"));
    currentAttemptWrong = false;

    targetChars = [...word.vi.normalize("NFC")];
    filled = new Array(targetChars.length).fill(null);
    letterState = shuffle(targetChars.map((ch, i) => ({ ch, id: i }))).map((item) => Object.assign({ used: false }, item));

    renderSlots();
    renderLetters();
  }

  function renderSlots() {
    document.getElementById("slots").innerHTML = filled.map((ch) => '<div class="spelling-slot">' + (ch || "") + '</div>').join("");
  }

  function renderLetters() {
    const lettersEl = document.getElementById("letters");
    lettersEl.innerHTML = "";
    letterState.forEach((item, idx) => {
      const btn = document.createElement("button");
      btn.className = "letter-btn" + (item.used ? " used" : "");
      btn.textContent = item.ch;
      btn.addEventListener("click", () => onLetterClick(idx));
      lettersEl.appendChild(btn);
    });
  }

  function onLetterClick(idx) {
    const item = letterState[idx];
    if (item.used) return;
    const nextEmpty = filled.findIndex((c) => c === null);
    if (nextEmpty === -1) return;

    item.used = true;
    filled[nextEmpty] = item.ch;
    VietKidSound.playClick();
    renderSlots();
    renderLetters();

    if (filled.every((c) => c !== null)) checkAnswer();
  }

  function checkAnswer() {
    const assembled = filled.join("");
    const target = targetChars.join("");
    if (assembled === target) {
      VietKidSound.playCorrect();
      if (!currentAttemptWrong) { correctCount++; updateStats(); }
      setTimeout(nextQuestion, 900);
    } else {
      currentAttemptWrong = true;
      mistakesTotal++;
      VietKidSound.playWrong();
      document.querySelectorAll(".spelling-slot").forEach((s) => s.classList.add("wrong"));
      setTimeout(() => {
        filled = new Array(targetChars.length).fill(null);
        letterState.forEach((item) => (item.used = false));
        renderSlots();
        renderLetters();
      }, 700);
    }
  }

  function clearSlots() {
    filled = new Array(targetChars.length).fill(null);
    letterState.forEach((item) => (item.used = false));
    renderSlots();
    renderLetters();
  }

  function nextQuestion() {
    qIndex++;
    if (qIndex < order.length) renderQuestion();
    else finishGame();
  }

  function finishGame() {
    let stars;
    if (mistakesTotal === 0) stars = 3;
    else if (mistakesTotal <= order.length) stars = 2;
    else stars = 1;

    document.getElementById("stars-earned").textContent = "⭐".repeat(stars) + "☆".repeat(3 - stars);
    document.getElementById("score-text").textContent = "Ghép đúng ngay " + correctCount + "/" + order.length + " từ!";
    document.getElementById("result-modal").style.display = "flex";
    VietKidSound.playCheer();
    VietKidSound.confettiBurst();

    const profileId = Store.getCurrentProfileId();
    if (profileId) Store.saveProgress(profileId, topic.id, "spelling", correctCount, stars);
    renderHeader();
  }

  function startGame() {
    order = shuffle(allWords);
    qIndex = 0; mistakesTotal = 0; correctCount = 0;
    document.getElementById("result-modal").style.display = "none";
    renderQuestion();
  }

  document.getElementById("hint-btn").addEventListener("click", () => VietKidSpeech.speakVi(order[qIndex].vi));
  document.getElementById("clear-btn").addEventListener("click", clearSlots);
  document.getElementById("retry-btn").addEventListener("click", startGame);
  startGame();
}
